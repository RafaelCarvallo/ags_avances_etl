name: avances_salaires
version: '1.0.0'
profile: avances_salaires

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

vars:
  date_flux: null
  raw_chemin: data/raw

on-run-start:
  - "CREATE SCHEMA IF NOT EXISTS {{ relation_journal().schema }}"
  - "{{ creer_journal_chargements() }}"

on-run-end:
  - "{{ journaliser_chargements(results) }}"

models:
  avances_salaires:
    bronze:
      +tags: ['bronze']
      +schema: bronze
      +materialized: incremental
      +incremental_strategy: delete+insert
      +unique_key: _date_flux
      +full_refresh: false
      +on_schema_change: fail

    silver:
      +schema: silver
      staging: 
        +materialized: view
      historique:
        +materialized: incremental
        +incremental_strategy: delete+insert
        +unique_key: _date_flux
        +on_schema_change: fail
        +pre_hook: "{{ purger_flux_courant()}}"
